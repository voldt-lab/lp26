<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop All — VOLDT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-white font-sans">

  <header id="site-header" class="fixed top-0 left-0 right-0 z-50 bg-white/70 backdrop-blur-md"></header>

  <!-- Page Header -->
  <div class="pt-16 px-8 lg:px-16 py-12 border-b border-stone-200">
    <p class="text-[10px] tracking-[0.2em] uppercase text-stone-400 mb-2">VOLDT</p>
    <h1 class="text-3xl lg:text-4xl font-semibold text-stone-900 tracking-tight">Shop All</h1>
  </div>

  <!-- Product Grid -->
  <div class="grid grid-cols-2 lg:grid-cols-3" id="product-grid"></div>

  <footer id="site-footer" class="border-t border-stone-200 bg-white"></footer>

  <script src="js/cart.js"></script>
  <script src="js/header.js"></script>
  <script>
    const products = [
      { id:'vestige', name:'VOLDT Hardware', category:'Vestige', size:'Configurable', img:'assets/914133ec573121502a172fcea0d7aaef759c00fe.jpg', hoverImg:null, link:'hardware-config.html' },
      { id:'pf-floor', name:'PolyFrame Floor Lamp', category:'PolyFrames', size:null, img:'assets/29da261fae11e8815506ffcaee809b2fcbd34bfe.jpg', hoverImg:'assets/9978a8f52dc984036ee626d49e8bb08203893fe0.jpg', link:'polyframes-floor-lamp.html' },
      { id:'pf-table', name:'PolyFrame Table Lamp', category:'PolyFrames', size:null, img:'assets/1967efac521aba866dc207ed580f4382af241561.jpg', hoverImg:'assets/e2cdfd0d1d94bbb72793037d94d5162bf2d2d773.jpg', link:'polyframes-table-lamp.html' },
      { id:'pf-coat', name:'PolyFrame Coat Rack', category:'PolyFrames', size:null, img:'assets/e606d72b5a5629a9b588ac32abe08e258b92b1db.jpg', hoverImg:'assets/fed88fa2d4adaef229128481e9b4e47ef2fdce81.jpg', link:'polyframes-coat-rack.html' },
      { id:'pf-coffee', name:'PolyFrame Coffee Table', category:'PolyFrames', size:null, img:'assets/90efc59c9eb30586b1c1fff261db8a917a4daff8.jpg', hoverImg:'assets/dec5396a8cc6e83670576a5d0a288c74f3074e6b.jpg', link:'polyframes-coffee-table.html' },
      { id:'dtlb-lg', name:'Detroit Table Lamp B', category:'Detroit Lights', size:'Large', img:'assets/fc6a8d985282412e62851849b27a10efead95eb2.jpg', hoverImg:'assets/620fdc99d9a2f8039d4fd6ab9718cecf6b27f8f9.jpg', link:'detroit-table-lamp.html' },
      { id:'dpa-lg', name:'Detroit Pendant A', category:'Detroit Lights', size:'Large', img:'assets/a6f766489f20f93f24f164ec925ce2cdb2eb835f.jpg', hoverImg:'assets/177f5475887bf8810ce02749613cac0cc9b75a4b.jpg', link:'detroit-pendant.html' },
      { id:'dtla-lg', name:'Detroit Table Lamp A', category:'Detroit Lights', size:'Large', img:'assets/e005ffb8592589ea9883bf08ef2f100ef0b52bfb.jpg', hoverImg:'assets/38d7962704f7aa49355dd98db701b27a73d9e768.jpg', link:'detroit-table-lamp.html' },
      { id:'dpb-lg', name:'Detroit Pendant B', category:'Detroit Lights', size:'Large', img:'assets/c3f1ecb063bbf7eb7ea437040bcf23b5d7c14808.jpg', hoverImg:'assets/a593fe151473b32b526b790458cee132453c2f08.jpg', link:'detroit-pendant.html' },
      { id:'dpa-std', name:'Detroit Pendant A', category:'Detroit Lights', size:'Standard', img:'assets/ca93ba95ec2321cecc3f6971cc7b2456a99f48fc.jpg', hoverImg:'assets/92ce76be27045bd0283d04f5ae520db1c5684f4d.jpg', link:'detroit-pendant.html' },
      { id:'dpb-std', name:'Detroit Pendant B', category:'Detroit Lights', size:'Standard', img:'assets/180fc790d95222d8b1e61a805e5d1a0cd85f30b0.jpg', hoverImg:'assets/d553197044225f86bdf58676f1b5016e67d7a92c.jpg', link:'detroit-pendant.html' },
      { id:'dtla-std', name:'Detroit Table Lamp A', category:'Detroit Lights', size:'Standard', img:'assets/8afb5fbb428ef6e188acefcc150d78921c1a06a6.jpg', hoverImg:'assets/9938ab6682fc63e127dee83e1088543f4df50ad1.jpg', link:'detroit-table-lamp.html' },
      { id:'dtlb-std', name:'Detroit Table Lamp B', category:'Detroit Lights', size:'Standard', img:'assets/f70e26754c5836fb0d7f077c0da565d8d4d3b7b3.jpg', hoverImg:null, link:'detroit-table-lamp.html' },
    ];
    const grid = document.getElementById('product-grid');
    products.forEach(p => {
      const a = document.createElement('a');
      a.href = p.link;
      a.className = 'group relative overflow-hidden bg-stone-100 block';
      a.style.aspectRatio = '3/4';
      a.innerHTML = `
        <img src="${p.img}" alt="${p.name}" class="absolute inset-0 w-full h-full object-cover transition-all duration-700 group-hover:opacity-0 scale-100 group-hover:scale-105" />
        ${p.hoverImg ? `<img src="${p.hoverImg}" alt="${p.name} alternate" class="absolute inset-0 w-full h-full object-cover transition-all duration-700 opacity-0 group-hover:opacity-100" />` : ''}
        <div class="absolute top-3 left-3 w-32 bg-white/90 backdrop-blur-sm border border-white/60 shadow-lg px-3 py-2 rounded-sm" style="min-height:56px">
          <p class="text-[7px] tracking-[0.15em] uppercase text-stone-500 mb-0.5 font-medium">${p.category}</p>
          <h3 class="text-[10px] text-stone-900 font-medium leading-tight">${p.name}</h3>
          ${p.size ? `<p class="text-[8px] text-stone-600 mt-0.5">${p.size}</p>` : ''}
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-black/20 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
      `;
      grid.appendChild(a);
    });
  </script>
</body>
</html>
