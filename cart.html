<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — VOLDT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-white font-sans">
  <header id="site-header" class="fixed top-0 left-0 right-0 z-50 bg-white/70 backdrop-blur-md"></header>
  <div class="pt-20 min-h-screen">
    <div class="max-w-6xl mx-auto px-8 py-16">
      <h1 class="text-3xl font-medium text-stone-900 mb-12">Your Cart</h1>

      <!-- Empty state -->
      <div id="cart-empty" class="hidden text-center py-32">
        <p class="text-stone-400 text-sm mb-8">Your cart is empty.</p>
        <a href="collections.html" class="inline-block px-8 py-4 bg-stone-900 text-white text-xs tracking-[0.15em] uppercase hover:bg-[#C8922A] transition-colors">Browse Products</a>
      </div>

      <!-- Cart content -->
      <div id="cart-content" class="hidden">
        <div class="grid lg:grid-cols-3 gap-16">
          <!-- Items -->
          <div class="lg:col-span-2">
            <div id="cart-items" class="divide-y divide-stone-200"></div>
            <div class="mt-8 pt-8 border-t border-stone-200">
              <button onclick="handleClearCart()" class="text-xs tracking-[0.1em] uppercase text-stone-400 hover:text-stone-900 transition-colors">Clear Cart</button>
            </div>
          </div>

          <!-- Summary -->
          <div>
            <div class="bg-stone-50 p-8 sticky top-28">
              <h2 class="text-sm tracking-[0.1em] uppercase text-stone-700 mb-8">Order Summary</h2>
              <div class="space-y-4 mb-8">
                <div class="flex justify-between text-sm">
                  <span class="text-stone-600">Subtotal</span>
                  <span id="summary-subtotal" class="text-stone-900">$0</span>
                </div>
                <div class="flex justify-between text-sm">
                  <span class="text-stone-600">Shipping</span>
                  <span class="text-stone-500 italic">Calculated at checkout</span>
                </div>
                <div class="flex justify-between text-sm">
                  <span class="text-stone-600">Tax</span>
                  <span class="text-stone-500 italic">Calculated at checkout</span>
                </div>
              </div>
              <div class="border-t border-stone-200 pt-6 mb-8">
                <div class="flex justify-between">
                  <span class="text-sm font-medium text-stone-900">Estimated Total</span>
                  <span id="summary-total" class="text-xl text-stone-900">$0</span>
                </div>
              </div>
              <!-- Discount code -->
              <div class="flex gap-2 mb-4">
                <input id="discount-code" type="text" placeholder="Discount code"
                  class="flex-1 px-3 py-2 text-xs border border-stone-300 text-stone-900 placeholder-stone-400 focus:outline-none focus:border-stone-600 bg-white uppercase tracking-widest" />
              </div>
              <button onclick="handleCheckout()" class="w-full py-4 bg-stone-900 text-white text-xs tracking-[0.15em] uppercase hover:bg-[#C8922A] transition-colors mb-4">Proceed to Checkout</button>
              <a href="collections.html" class="block text-center text-xs tracking-[0.1em] uppercase text-stone-500 hover:text-stone-900 transition-colors">Continue Shopping</a>
              <div class="mt-8 pt-8 border-t border-stone-200 space-y-3">
                <div class="flex items-center gap-3 text-xs text-stone-500">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                  Secure checkout by Shopify
                </div>
                <div class="flex items-center gap-3 text-xs text-stone-500">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  Made to order · 3–5 week lead time
                </div>
                <div class="flex items-center gap-3 text-xs text-stone-500">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                  US-based manufacturing
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer id="site-footer" class="border-t border-stone-200 bg-white"></footer>
  </div>
  <script src="js/cart.js"></script><script src="js/shopify.js"></script><script src="js/header.js"></script>
  <script>
    function formatOptions(options) {
      if (!options || typeof options !== 'object') return '';
      return Object.entries(options).map(([k, v]) => `${k}: ${v}`).join(' · ');
    }

    function renderCart() {
      const items = getCart();
      const emptyEl = document.getElementById('cart-empty');
      const contentEl = document.getElementById('cart-content');
      const itemsEl = document.getElementById('cart-items');

      if (items.length === 0) {
        emptyEl.classList.remove('hidden');
        contentEl.classList.add('hidden');
        return;
      }

      emptyEl.classList.add('hidden');
      contentEl.classList.remove('hidden');

      itemsEl.innerHTML = items.map(item => `
        <div class="py-8 flex gap-6" data-id="${item.id}">
          <div class="w-24 h-24 bg-stone-100 flex-shrink-0 overflow-hidden">
            ${item.image ? `<img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover" />` : ''}
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-sm font-medium text-stone-900 mb-1">${item.name}</h3>
            ${item.options ? `<p class="text-xs text-stone-500 mb-3">${formatOptions(item.options)}</p>` : '<div class="mb-3"></div>'}
            <div class="flex items-center gap-4">
              <div class="flex items-center border border-stone-300">
                <button onclick="changeQty('${item.id}', ${item.quantity - 1})" class="w-8 h-8 flex items-center justify-center text-stone-600 hover:bg-stone-100 transition-colors text-lg leading-none">−</button>
                <span class="w-8 h-8 flex items-center justify-center text-sm text-stone-900">${item.quantity}</span>
                <button onclick="changeQty('${item.id}', ${item.quantity + 1})" class="w-8 h-8 flex items-center justify-center text-stone-600 hover:bg-stone-100 transition-colors text-lg leading-none">+</button>
              </div>
              <button onclick="handleRemove('${item.id}')" class="text-xs text-stone-400 hover:text-red-600 transition-colors">Remove</button>
            </div>
          </div>
          <div class="text-sm text-stone-900 font-medium flex-shrink-0">$${(item.price * item.quantity).toLocaleString()}</div>
        </div>
      `).join('');

      const total = getTotal();
      document.getElementById('summary-subtotal').textContent = '$' + total.toLocaleString();
      document.getElementById('summary-total').textContent = '$' + total.toLocaleString();
    }

    function changeQty(id, qty) {
      if (qty < 1) {
        handleRemove(id);
      } else {
        updateQty(id, qty);
        renderCart();
      }
    }

    function handleRemove(id) {
      removeItem(id);
      renderCart();
    }

    function handleClearCart() {
      if (confirm('Remove all items from your cart?')) {
        clearCart();
        renderCart();
      }
    }

    function handleCheckout() {
      const btn = document.querySelector('button[onclick="handleCheckout()"]');
      const code = document.getElementById('discount-code').value.trim();
      btn.textContent = 'Redirecting…';
      btn.disabled = true;
      createShopifyCheckout(code).finally(() => {
        btn.textContent = 'Proceed to Checkout';
        btn.disabled = false;
      });
    }

    renderCart();
  </script>
</body>
</html>
