<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ -- VOLDT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-white font-sans">
  <header id="site-header" class="fixed top-0 left-0 right-0 z-50 bg-white/70 backdrop-blur-md"></header>
  <div class="pt-16">
    <div class="max-w-4xl mx-auto px-8 lg:px-12 py-24 lg:py-32">

      <!-- Header -->
      <div class="mb-20">
        <h1 class="text-4xl lg:text-5xl font-bold tracking-tight mb-6">Frequently Asked Questions</h1>
        <p class="text-base text-black/70 leading-relaxed max-w-2xl">Common questions about ordering, shipping, customization, and our manufacturing process.</p>
      </div>

      <!-- FAQ Sections -->
      <div class="space-y-16" id="faq-container"></div>

      <!-- Contact Footer -->
      <div class="mt-24 pt-12 border-t border-black/10 text-center">
        <p class="text-base text-black/70 mb-4">Still have a question?</p>
        <p class="text-sm text-black/60">Contact us at <a href="mailto:info@voldtlab.com" class="text-black hover:text-black/60 transition-colors underline">info@voldtlab.com</a> and we'll respond promptly.</p>
      </div>
    </div>
    <footer id="site-footer" class="border-t border-stone-200 bg-white"></footer>
  </div>
  <script src="js/cart.js"></script><script src="js/header.js"></script>
  <script>
    const faqSections = [
      {
        title: 'Orders & Returns',
        items: [
          { q: 'What is your return policy?', a: 'We accept returns within 30 days of purchase for a refund of the item price. Shipping costs are non-refundable. Items must be returned in original condition. To initiate a return, please contact us with your receipt.' },
          { q: 'Are custom orders eligible for return?', a: 'Custom or modified pieces are typically considered final sale unless damaged or defective upon arrival. Exceptions may be possible on a case-by-case basis.' },
          { q: 'What forms of payment do you accept?', a: 'We accept major credit cards. Payment is handled by Stripe' }
        ]
      },
      {
        title: 'Lead Times & Shipping',
        items: [
          { q: 'How long will my order take to ship?', a: 'Lead times vary by collection. Suggested timeframe below:\nPolyframe Series: 4-6 weeks\nDetroit Lights: 1-3 weeks\nVOLDT Hardware: 4-6 weeks\nYou will receive tracking information once your order ships. See details on our Shipping page.' },
          { q: 'Why are lead times longer than mass-market products?', a: 'Many VOLDT pieces are made to order or produced in small batches. This reduces waste and allows us to maintain quality and precision in every piece. We are a small fabrication operation and will do our best to honor timely delivery.' },
          { q: 'Do you ship internationally?', a: 'Please contact us for international shipping inquiries. Duties and customs fees, if applicable, are the responsibility of the buyer.' },
          { q: 'What if my item arrives damaged?', a: 'Please notify us within 72 hours of delivery with photographs of the packaging and product. We will work quickly to repair or replace the item.' }
        ]
      },
      {
        title: 'Product & Installation',
        items: [
          { q: 'Do products arrive assembled?', a: 'Most lighting pieces arrive fully assembled. Some products may require minor installation. All necessary mounting hardware and instructions are included unless otherwise noted.' },
          { q: 'Are bulbs included with lighting?', a: 'Bulb inclusion varies by product. Please refer to the product page specifications for details.' },
          { q: 'Are your lighting components certified?', a: 'We use high-quality, code-compliant electrical components. For specific certification requirements, please contact us prior to ordering.' },
          { q: 'What electrical requirements should I be aware of?', a: 'Most fixtures are designed for standard residential voltage. Refer to individual product specifications for exact details.' }
        ]
      },
      {
        title: 'Customization & Trade',
        items: [
          { q: 'Can I request custom dimensions or finishes?', a: 'Yes. Many pieces can be adjusted in size or finish. Customization may affect pricing and lead time. Please contact us to discuss your project.' },
          { q: 'Do you provide files or specifications for designers?', a: 'Specifications are noted on product pages. We are happy to provide digital models for staging purposes upon request.' },
          { q: 'Do you offer volume pricing?', a: 'For larger or commercial projects, please contact us directly to discuss scope and pricing.' }
        ]
      },
      {
        title: 'Materials & Sustainability',
        items: [
          { q: 'How are your products made?', a: 'VOLDT utilizes advanced additive manufacturing and precision fabrication methods. This approach often reduces material waste and allows for refined detailing not achievable through conventional mass production.' },
          { q: 'Where are your products made?', a: 'Our products are designed and manufactured in the United States. When sourcing components, we prioritize U.S.-based suppliers whenever possible. Certain sub-component may be assembled abroad into parts we use' },
          { q: 'How do you approach sustainability?', a: 'We produce in small batches or made-to-order runs to avoid excess inventory. Our additive processes use only the material necessary, reducing waste at the source. Raw materials that are recyclable or upcycled will be proritized.' }
        ]
      }
    ];

    const container = document.getElementById('faq-container');
    const openItems = new Set();

    faqSections.forEach((section, si) => {
      const sectionEl = document.createElement('div');

      const heading = document.createElement('h2');
      heading.className = 'text-2xl font-semibold tracking-tight mb-8 pb-4 border-b border-black/10';
      heading.textContent = section.title;
      sectionEl.appendChild(heading);

      const itemsEl = document.createElement('div');
      itemsEl.className = 'space-y-4';

      section.items.forEach((item, ii) => {
        const key = `${si}-${ii}`;
        const wrapper = document.createElement('div');
        wrapper.className = 'border border-black/10';

        const btn = document.createElement('button');
        btn.className = 'w-full flex items-center justify-between p-6 text-left hover:bg-black/[0.02] transition-colors';
        btn.innerHTML = `
          <span class="text-base tracking-tight pr-4">${item.q}</span>
          <svg class="w-5 h-5 text-black/40 transition-transform duration-200 flex-shrink-0 faq-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        `;

        const answer = document.createElement('div');
        answer.className = 'px-6 pb-6 hidden';
        answer.innerHTML = `<p class="text-sm text-black/60 leading-relaxed whitespace-pre-line">${item.a}</p>`;

        btn.addEventListener('click', () => {
          const isOpen = openItems.has(key);
          if (isOpen) {
            openItems.delete(key);
            answer.classList.add('hidden');
            btn.querySelector('.faq-chevron').style.transform = '';
          } else {
            openItems.add(key);
            answer.classList.remove('hidden');
            btn.querySelector('.faq-chevron').style.transform = 'rotate(180deg)';
          }
        });

        wrapper.appendChild(btn);
        wrapper.appendChild(answer);
        itemsEl.appendChild(wrapper);
      });

      sectionEl.appendChild(itemsEl);
      container.appendChild(sectionEl);
    });
  </script>
</body>
</html>
